name: Home Assistant app build check

on:
  pull_request:
    paths:
      - ".github/workflows/home-assistant-app.yml"
      - "app/config.py"
      - "app/services/mqtt_client.py"
      - "app/main.py"
      - "app/templates/index.html"
      - "app/static/js/app.js"
      - "app/static/css/fonts.css"
      - "homeassistant_app/eero_dashboard/**"
      - "requirements.txt"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/home-assistant-app.yml"
      - "app/config.py"
      - "app/services/mqtt_client.py"
      - "app/main.py"
      - "app/templates/index.html"
      - "app/static/js/app.js"
      - "app/static/css/fonts.css"
      - "homeassistant_app/eero_dashboard/**"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Home Assistant app image
        uses: docker/build-push-action@v6
        with:
          context: homeassistant_app/eero_dashboard
          platforms: linux/amd64
          push: false
          build-args: |
            BUILD_VERSION=1.0.0
            BUILD_ARCH=amd64
            SOURCE_REPOSITORY=${{ github.event.pull_request.head.repo.full_name || github.repository }}.git
            SOURCE_REF=${{ github.event.pull_request.head.ref || 'main' }}
